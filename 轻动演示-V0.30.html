<script>(function(root) {
  'use strict';
  const cards=['月度运动会员卡','季度健康会员卡','年度活力会员卡'];
  function rankRows(rows,o) {
    return rows.filter(r=>r.month===o.month && (o.scope==='all'||r.region===o.region))
      .filter(r=>o.metric!=='weight'||(r.verified&&Number.isFinite(r.baseline)&&r.baseline>0&&Number.isFinite(r.weight)&&r.weight>0))
      .map(r=>({...r,score:o.metric==='weight'?Math.max(0,Number(((r.baseline-r.weight)*(o.weightMode==='kg'?1:100/r.baseline)).toFixed(2))):Number(r.days||0)}))
      .sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id))
      .map((r,i,a)=>({...r,rank:i&&r.score===a[i-1].score?a.findIndex(x=>x.score===r.score)+1:i+1}));
  }
  function publicLossRank(rows,o){return rankRows(rows,{...o,metric:'weight',weightMode:'kg'}).map(({id,name,region,month,score,rank})=>({id,name,region,month,score,rank}));}
  function checkIn(state,date){if(state.checkins.includes(date))return false;state.checkins.push(date);return true;}
  function validateWeight(value,previous){
    const weight=Number(value);
    if(String(value).trim()===''||!Number.isFinite(weight)||weight<20||weight>350)return {ok:false,message:'请输入 20–350 kg 的有效数值（演示录入范围）'};
    if(Math.abs(weight*10-Math.round(weight*10))>0.00001)return {ok:false,message:'体重最多保留一位小数'};
    return {ok:true,weight,flagged:Number.isFinite(previous)&&Math.abs(weight-previous)>3};
  }
  function validatePrize(p){
    if(!p||!['physical','card'].includes(p.type))return {ok:false,message:'请选择奖品类型'};
    if(!String(p.name||'').trim()||String(p.name).length>50)return {ok:false,message:'请填写 1–50 字的奖品名称'};
    if(p.type==='card'&&!cards.includes(p.name))return {ok:false,message:'请选择系统会员卡目录中的卡片'};
    if(!Number.isInteger(Number(p.quantity))||Number(p.quantity)<1)return {ok:false,message:'库存须为正整数'};
    return {ok:true};
  }
  const api={publicLossRank,cards,rankRows,checkIn,validateWeight,validatePrize};
  if(typeof module!=='undefined')module.exports=api;else root.DemoModel=api;
})(typeof window!=='undefined'?window:globalThis);

root.NextViews={chart,photoEntry,quickFunctions,create(o){const {esc,state,date}=o,$=s=>document.querySelector(s);let bannerDraft=null,uploading=false,postPage=0,postQuery='',postStatus='all',adminRole='hq';const save=m=>{o.save();o.render();if(m)o.toast(m);},plans=()=>N.catalog(state()),options=id=>plans().filter(p=>p.enabled).map(p=>`<option value="${esc(p.id)}" ${p.id===id?'selected':''}>${esc(p.name)} · ${p.days}天 · 每日${p.daily}次</option>`).join('');

function bannerOps(){return `<section class="panel panel-pad"><div class="panel-head"><div><h2>挑战首页图片展示位</h2><p>上传图片，同时配置网页、小程序或微信二维码。</p></div><button class="btn primary" data-next="new-banner">+ 新增展示图片</button></div><p class="hint">总部配置 · 最多5个展示位 · 图片JPG/PNG/WebP、单张最多3MB。开启后自动同步挑战首页。</p>${(state().banners||[]).map(b=>`<article class="banner-admin"><img src="${b.image}" alt="${esc(b.title)}"><div><h3>${esc(b.title)}</h3><p>${{link:'网页链接',mini:'其他小程序',qr:'微信二维码'}[b.type]} · ${b.enabled?'展示中':'已隐藏'}</p><p class="hint">${esc(b.type==='link'?b.url:b.type==='mini'?b.appId+' / '+b.path:'点击后打开二维码，长按识别')}</p><button class="btn small" data-next-edit-banner="${b.id}">编辑</button> <button class="btn small" data-next-toggle-banner="${b.id}">${b.enabled?'隐藏':'展示'}</button> <button class="btn small" data-next-delete-banner="${b.id}">删除展示位</button></div></article>`).join('')||'<div class="empty">尚未配置展示图片，首页显示默认品牌展示位。</div>'}</section>`;}
function bannerForm(id){bannerDraft=(state().banners||[]).find(b=>b.id===id);bannerDraft=bannerDraft?{...bannerDraft}:{title:'',type:'link',image:'',qr:'',url:'',appId:'',path:'',enabled:true};drawBanner();}
function readBanner(){const f=$('#next-banner-form');if(!f)return;const d=new FormData(f);for(const k of ['title','type','url','appId','path'])bannerDraft[k]=String(d.get(k)||'');bannerDraft.enabled=d.get('enabled')==='on';}
function drawBanner(){o.modal(`<h2>${bannerDraft.id?'编辑':'新增'}首页图片</h2><form id="next-banner-form"><label class="field">展示名称<input name="title" maxlength="50" required value="${esc(bannerDraft.title)}"></label><label class="field wide-gap">上传展示图片<input id="next-banner-image" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="next-banner-image-preview">${bannerDraft.image?`<img class="banner-form-preview" src="${bannerDraft.image}" alt="展示图片预览">`:''}</div><label class="field wide-gap">跳转方式<select name="type" id="next-banner-type">${[['link','指定网页链接'],['mini','其他小程序'],['qr','微信二维码']].map(([v,t])=>`<option value="${v}" ${bannerDraft.type===v?'selected':''}>${t}</option>`).join('')}</select></label><div id="next-banner-target">${targetFields()}</div><label class="field wide-gap"><span><input type="checkbox" name="enabled" ${bannerDraft.enabled?'checked':''}> 保存后在挑战首页展示</span></label><div class="error" id="next-banner-error" role="alert"></div><button class="btn primary wide-gap" ${uploading?'disabled':''}>保存展示配置</button></form>`);}
function targetFields(){return bannerDraft.type==='link'?`<label class="field wide-gap">网页链接<input name="url" type="url" required value="${esc(bannerDraft.url)}" placeholder="https://..."></label>`:bannerDraft.type==='mini'?`<label class="field wide-gap">小程序AppID<input name="appId" required value="${esc(bannerDraft.appId)}" placeholder="wx开头的AppID"></label><label class="field wide-gap">小程序页面路径<input name="path" required value="${esc(bannerDraft.path)}" placeholder="pages/index/index"></label><p class="hint">正式小程序调用微信跳转能力；HTML演示显示配置参数。</p>`:`<label class="field wide-gap">上传微信二维码<input id="next-banner-qr" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="next-banner-qr-preview">${bannerDraft.qr?`<img class="qr-preview" src="${bannerDraft.qr}" alt="微信二维码预览">`:''}</div><p class="hint">消费者点击首页图片后查看二维码原图，并长按识别。识别能力取决于微信环境。</p>`;}
async function upload(file,field){if(!file||uploading)return;const error=$('#next-banner-error');if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>3*1024*1024){error.textContent='请选择3MB以内JPG/PNG/WebP图片';return;}uploading=true;$('#next-banner-form button').disabled=true;try{const bitmap=await createImageBitmap(file);if(!bitmap.width||!bitmap.height||bitmap.width>12000||bitmap.height>12000)throw Error();const scale=Math.min(1,(field==='qr'?1600:1400)/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bitmap.width*scale));c.height=Math.max(1,Math.round(bitmap.height*scale));c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);bitmap.close();const encoded=field==='qr'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.78);if(encoded.length>1200000){error.textContent='图片压缩后仍过大，请上传更小的图片（建议宽1400像素以内）';return;}bannerDraft[field]=encoded;$(field==='qr'?'#next-banner-qr-preview':'#next-banner-image-preview').innerHTML=`<img class="${field==='qr'?'qr-preview':'banner-form-preview'}" src="${bannerDraft[field]}" alt="已上传${field==='qr'?'二维码':'展示图片'}">`;error.textContent='';}catch{error.textContent='图片无法解码，请重新上传';}finally{uploading=false;if($('#next-banner-form button'))$('#next-banner-form button').disabled=false;}}
function openBanner(id){const b=state().banners.find(x=>x.id===id&&x.enabled);if(!b)return;if(b.type==='link'){o.modal(`<h2>${esc(b.title)}</h2><p>打开以下网页</p><p class="post-text">${esc(b.url)}</p><a class="btn primary" href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">打开网页 ↗</a>`);return;}if(b.type==='mini'){if(root.wx?.navigateToMiniProgram){root.wx.navigateToMiniProgram({appId:b.appId,path:b.path,fail:()=>o.toast('小程序跳转失败，请检查配置')});return;}o.modal(`<h2>${esc(b.title)}</h2><p>已配置其他小程序跳转</p><div class="notice">当前为HTML演示，无法直接打开微信小程序。正式环境按下方参数调用微信跳转。</div><p>AppID：${esc(b.appId)}</p><p>路径：${esc(b.path)}</p>`);return;}o.modal(`<h2>${esc(b.title)}</h2><p>长按下方二维码，识别添加微信</p><img class="wechat-qr" src="${b.qr}" alt="微信二维码，长按识别"><p class="hint">请在微信环境中长按识别；普通浏览器可保存图片后用微信扫一扫。</p><a class="btn soft" href="${b.qr}" download="微信二维码.png">保存二维码</a>`);}
function forumOps(){const posts=state().community.posts,filtered=posts.filter(p=>(postStatus==='all'||p.status===postStatus)&&(!postQuery||(p.title||p.text).includes(postQuery)||(p.nickname||p.user).includes(postQuery))),pages=Math.max(1,Math.ceil(filtered.length/10));postPage=Math.min(postPage,pages-1);return `<section class="panel panel-pad wide-gap"><div class="panel-head"><div><h2>论坛笔记管理</h2><p>文字、标题与全部图片人工审核通过后公开；编辑会重新进入待审核。</p></div><label class="field">管理身份<select id="next-forum-role"><option value="hq" ${adminRole==='hq'?'selected':''}>总部管理员</option><option value="region" ${adminRole==='region'?'selected':''}>区域管理员</option></select></label></div>${adminRole!=='hq'?'<p class="empty">仅总部可查看和管理帖子。</p>':`<form id="next-post-search" class="toolbar"><label class="field">搜索标题/作者<input name="query" value="${esc(postQuery)}"></label><label class="field">帖子状态<select name="status">${[['all','全部'],['pending','待审核'],['approved','已通过'],['rejected','未通过'],['deleted','已删除']].map(([v,t])=>`<option value="${v}" ${postStatus===v?'selected':''}>${t}</option>`).join('')}</select></label><button class="btn">筛选</button></form><div class="table-wrap"><table class="post-admin-table"><thead><tr>${['笔记标题','作者','获赞数','评论数','阅读数','分享数','收藏数','投诉数','发布时间','帖子状态','操作'].map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${filtered.slice().reverse().slice(postPage*10,postPage*10+10).map(p=>{const m=N.postStats(p);return `<tr><td>${esc(p.title||p.text.slice(0,24)||'图片笔记')}${p.recommended?'<span class="mini-tag">推荐</span>':''}</td><td>${esc(p.nickname||p.user)}<br><small>${esc(p.user)}</small></td>${['likes','comments','views','shares','favorites','complaints'].map(k=>`<td>${m[k]}</td>`).join('')}<td>${esc(p.createdAt?new Date(p.createdAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):p.date)}</td><td>${{pending:'待审核',approved:'已通过',rejected:'未通过',withdrawn:'已撤回',deleted:'已删除'}[p.status]}</td><td><div class="post-admin-actions"><button class="btn small" data-next-post-view="${p.id}">查看</button>${p.status==='deleted'?`<button class="btn small" data-next-post-restore="${p.id}">恢复待审核</button>`:`<button class="btn small" data-next-post-review="${p.id}">${p.status==='approved'?'审核/下架':'审核通过'}</button><button class="btn small" data-next-post-feature="${p.id}" ${p.status!=='approved'?'disabled':''}>${p.recommended?'取消推荐':'设为推荐'}</button><button class="btn small" data-next-post-edit="${p.id}">编辑</button><button class="btn small" data-next-post-delete="${p.id}">删除</button>`}</div></td></tr>`;}).join('')||'<tr><td colspan="11" class="empty">暂无匹配笔记</td></tr>'}</tbody></table></div><div class="table-note">共${filtered.length}篇 · 第${postPage+1}/${pages}页<div><button class="btn small" data-next-post-page="-1" ${postPage===0?'disabled':''}>上一页</button> <button class="btn small" data-next-post-page="1" ${postPage>=pages-1?'disabled':''}>下一页</button></div></div>`}</section>`;}
function viewPost(id,review=false){const p=state().community.posts.find(x=>x.id===id);if(!p||adminRole!=='hq')return;o.modal(`<h2>${esc(p.title||p.text.slice(0,30)||'图片笔记')}</h2><p>${esc(p.nickname||p.user)} · ${esc(p.createdAt?new Date(p.createdAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):p.date)} · ${{pending:'待审核',approved:'已通过',rejected:'未通过',deleted:'已删除'}[p.status]||esc(p.status)}</p><p class="post-text">${esc(p.text)}</p><div class="forum-images">${p.images.map(src=>`<img src="${src}" alt="待审核原内容图片">`).join('')}</div>${review&&!['deleted','withdrawn'].includes(p.status)?`<label class="field wide-gap">审核说明<input id="next-post-review-note" maxlength="200" placeholder="至少4字，核对文字与全部图片"></label><div class="form-actions">${p.status!=='approved'?`<button class="btn primary" data-next-post-decision="${p.id}" data-decision="approved">审核通过</button>`:''}<button class="btn" data-next-post-decision="${p.id}" data-decision="rejected">${p.status==='approved'?'下架内容':'不予通过'}</button></div>`:''}<div class="error" id="next-post-error"></div>${p.complaints?.length?`<details class="wide-gap"><summary>投诉明细（${p.complaints.length}条）</summary>${p.complaints.map(c=>`<p>${esc(c.date)} · ${esc(c.user)}：${esc(c.reason)}</p>`).join('')}</details>`:''}${(p.audit||[]).map(a=>`<p class="hint">${esc(a.date)} · ${esc(a.note)}</p>`).join('')}`);}
function estimateForm(){const d=state().health.days[date],cfg=state().estimateSettings||{};o.modal(`<h2>预估体重 · 情景参数</h2><div class="notice warn">这是能量情景演示，无法准确预测体重。水分、代谢适应及漏记都会影响结果；估值不写入手动体重或榜单。</div><form id="next-estimate-form"><label class="field wide-gap">假设每日基础与日常消耗（千卡，不含已记录运动）<input type="number" name="maintenance" min="1000" max="6000" required value="${cfg.maintenance||2200}"></label><p class="hint">2200为演示假设值，不是依据你的年龄、身高计算的建议。运动记录另计，避免重复计入。</p><label class="field"><span><input type="checkbox" name="complete" ${d?.dietComplete?'checked':''}> 我已完整记录今天全部饮食</span></label><p class="hint">未勾选时，将尚未记录的摄入补足至当日目标后估算，避免把一餐当作全天。缺记录的日期不推算。只显示已有记录日，不延伸长期预测。</p><p class="hint">演示计算：（假设全天摄入－假设日常消耗－已记运动）÷7700，与最近手填起点关联；7700是简化系数，实际变化不是固定线性换算。<a href="https://www.niddk.nih.gov/health-information/professionals/diabetes-discoveries-practice/nih-body-weight-planner" target="_blank" rel="noopener">NIDDK体重变化模型说明</a></p><button class="btn primary">保存情景条件</button></form>`);}

</script><script>(function(root){'use strict';root.InviteFriends={create(o){const I=root.InviteModel,R=root.RewardModel,W=root.EntitlementModel,esc=o.esc,$=s=>document.querySelector(s),state=o.state,date=o.date;let role='hq',code=new URLSearchParams(location.hash.split('?')[1]||'').get('code')||'';

 function profileModal(){const p=model().profile;o.modal(`<h2>自己的目标，自己的节奏</h2><p>设置 ${selectedDate} 的热量目标，同时作为后续新日期的默认值。已有其他日期的目标保持原值。</p><form id="health-profile-form"><div class="form-grid"><label class="field full">每日摄入目标（千卡）<input name="goal" type="number" min="1" max="10000" step="1" value="${day().goal}" required></label><label class="field full">我的忌口（逗号分隔）<textarea id="health-avoid" name="avoid" maxlength="300" placeholder="例如：乳制品、鸡蛋、花生">${esc(p.avoid.join('、'))}</textarea></label></div><div class="avoid-tags">${['乳制品','鸡蛋','豆制品','海鲜','坚果','麸质','咖啡因','花生'].map(t=>`<button type="button" class="${p.avoid.includes(t)?'selected':''}" data-h-avoid="${t}">${t}</button>`).join('')}</div><div class="notice warn">目标由用户自行设定，演示不自动判断适宜摄入量。忌口按已知标签过滤，无法理解所有自由文本，也不能保证过敏安全；请核对实际配料。</div><div id="health-form-error" class="error" role="alert"></div><div class="form-actions"><button class="btn primary" type="submit">保存目标与忌口 ↗</button></div></form>`);}
 function weightModal(){const w=o.weights().filter(r=>r.date===selectedDate&&r.status!=='rejected').at(-1);o.modal(`<h2>记下${selectedDate===o.date?'今天':selectedDate}的体重</h2><p>个人曲线提交后即时更新，标记为自填待核验；公开榜与小队不展示体重。</p><form id="health-weight-form"><label class="field">每日体重（kg）<input name="weight" type="number" min="20" max="350" step="0.1" required placeholder="例如 79.5" value="${w?.value??''}"></label><label class="field wide-gap">记录备注<input name="note" maxlength="100" placeholder="例如：起床后，同一台秤"></label><div id="health-form-error" class="error" role="alert"></div><div class="form-actions"><button class="btn primary" type="submit">保存每日体重 ↗</button></div></form>`);}
 function historyModal(){const h=model(),dates=[...new Set([...Object.keys(h.days).filter(k=>h.days[k].meals.length||h.days[k].exercises.length),...o.weights().map(r=>r.date)])].sort().reverse();o.modal(`<h2>我的每日记录</h2><p>按日期查看饮食、运动与体重。没有记录的日期也可通过页面顶部日历打开。</p><div class="history-list">${dates.map(date=>{const d=h.days[date],s=d?M.summary(d):null,w=o.weights().filter(r=>r.date===date&&r.status!=='rejected').at(-1);return `<button class="history-item" data-h-date="${date}"><span><b>${date}</b><small>${d?.meals.length||0} 条饮食 · ${d?.exercises.length||0} 条运动${w?' · '+w.value+' kg':''}</small></span><span>${num(s?.intake||0)}<small>摄入千卡 ↗</small></span></button>`;}).join('')||'<div class="empty">还没有历史记录</div>'}</div>`);}
 function recipeModal(key){const recipe=M.recipes.find(r=>r.id===key);if(!recipe)return;const f=M.recipeFood(recipe);o.modal(`<h2>${esc(f.name)}</h2><p>每份 ${num(f.kcal)} 千卡 · 蛋白质 ${num(f.protein)} g · 碳水 ${num(f.carb)} g · 脂肪 ${num(f.fat)} g</p><h3 class="section-title">食材与份量</h3><ul class="modal-list">${recipe.items.map(([key,q])=>{const f=M.foods.find(x=>x.id===key);return `<li>${f.name} ${q} ${f.unit}</li>`;}).join('')}</ul><h3 class="section-title">做法参考</h3><ol class="modal-list">${recipe.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="hint">食谱和营养数据为演示示例；如换食材、配料或油量需重新计算。</p><button class="btn primary wide-gap" data-h-add="recipe:${recipe.id}">按份数计入饮食 ↗</button>`);}
 function exportHealth(){const body={account:'林小满（演示账号）',exportedAt:new Date().toISOString(),notes:'本地模拟档案；照片营养未经自动识别；竞赛体重核验状态独立保留',health:model(),weights:o.weights(),checkins:o.state().checkins,team:o.team()};const blob=new Blob([JSON.stringify(body,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='轻动-我的健康档案.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);o.toast('健康档案已导出到本地');}
 document.addEventListener('click',e=>{

  if(b.dataset.hAvoid){const input=$('#health-avoid'),values=M.parseAvoid(input.value),t=b.dataset.hAvoid;if(values.includes(t))values.splice(values.indexOf(t),1);else values.push(t);input.value=values.join('、');b.classList.toggle('selected',values.includes(t));return;}
  if(b.dataset.hPhoto){const record=day().meals.find(m=>m.id===b.dataset.hPhoto);if(record)o.modal(`<h2>这餐的照片与记录</h2><img src="${record.photo}" alt="${esc(record.name)}的本地食物照片" class="photo-detail"><p>${esc(record.name)} · ${record.quantity} ${record.unit} · ${num(record.kcal)} 千卡<br>${record.automatic?'这是模拟自动识别样例，未分析图片内容，营养值仅为估算。':'营养值来自人工确认的条目与份量，未进行图像识别。'}</p>`);return;}
  if(b.dataset.hDelete){o.modal(`<h2>移除这条${b.dataset.kind==='meal'?'饮食':'运动'}记录？</h2><p>移除后会重新汇总 ${selectedDate} 的热量与营养。照片随对应饮食记录一起移除。</p><button class="btn primary" data-h-confirm-delete="${esc(b.dataset.hDelete)}" data-kind="${b.dataset.kind}">确认移除</button>`);return;}
  if(b.dataset.hConfirmDelete){const d=day(),key=b.dataset.kind==='meal'?'meals':'exercises';d[key]=d[key].filter(x=>x.id!==b.dataset.hConfirmDelete);save();$('#modal').close();refresh();o.toast('记录已移除，汇总已更新');return;}
  switch(b.dataset.h){
   case 'search':query=$('#catalog-search').value;$('#catalog-results').innerHTML=catalogResults();break;
   case 'photo':o.openPhoto();break;
   case 'poster':o.openPrivacy(selectedDate);break;

   case 'weight':weightModal();break;
   case 'exercise':exerciseModal();break;
   case 'profile':profileModal();break;
   case 'history':historyModal();break;
   case 'team':o.joinTeam();break;
   case 'checkin':if(selectedDate===o.date){o.checkin();refresh();}break;
   case 'export':exportHealth();break;

  }
 });
 document.addEventListener('keydown',e=>{if(e.target.id==='catalog-search'&&e.key==='Enter'){e.preventDefault();query=e.target.value;$('#catalog-results').innerHTML=catalogResults();}});

 document.addEventListener('change',e=>{

 document.addEventListener('submit',e=>{

  if(e.target.id==='health-profile-form'){
   const goal=Number(data.get('goal'));if(!Number.isInteger(goal)||goal<=0||goal>10000){error('请输入 1–10000 的整数目标（演示表单范围）');return;}

   day().goal=goal;model().profile={...model().profile,goal,avoid};save();$('#modal').close();refresh();const unknown=M.unknownAvoid(avoid);o.toast(unknown.length?'已保存；部分忌口不在已知标签库，匹配可能不完整':'目标与忌口已保存，其他日期目标未改写');

   const q=Number(data.get('quantity')),f=pickerFood(data.get('food')||'');if(!f||!Number.isFinite(q)||q<=0||q>5000||(f.group==='食谱'&&q>20)){error('请确认食物，并填写有效份量（食谱最多 20 份）');return;}
   if(M.conflicts(f,M.effectiveAvoid(model().profile)).length){error('该食物与当前忌口冲突，请重新选择');return;}

   const n=f.group==='食谱'?Object.fromEntries(['kcal','protein','carb','fat'].map(k=>[k,Math.round(f[k]*q*100)/100])):M.nutrients(f,q);
   day().meals.push({id:id(),date:selectedDate,meal:data.get('meal'),foodId:f.id,name:f.name,group:f.group,unit:f.unit,quantity:q,...n,note:String(data.get('note')||'').trim(),photo:photo?photoDraft.data:null,source:photo?'本地照片 + 人工确认':'人工选择示例库',createdAt:new Date().toISOString()});
   if(photo&&selectedDate===o.date)o.checkin(true);photoDraft=null;photoToken++;save();$('#modal').close();refresh();o.toast(photo?'照片与营养已计入个人档案；当日打卡不重复累计':'已计入饮食，热量与营养素已更新');
  }
  if(e.target.id==='health-exercise-form'){
   const a=M.activities.find(a=>a.id===data.get('activity')),minutes=Number(data.get('minutes')),weight=Number(data.get('weight'));
   if(!a||!Number.isFinite(minutes)||minutes<=0||minutes>1440||!Number.isFinite(weight)||weight<20||weight>350){error('请确认运动类型、有效时长与体重');return;}
   const kcal=M.exerciseCalories(a.met,weight,minutes);day().exercises.push({id:id(),name:a.name,met:a.met,minutes,weight,kcal,date:selectedDate,createdAt:new Date().toISOString()});save();$('#modal').close();refresh();o.toast('运动记录已保存，剩余额度已重算');
  }
  if(e.target.id==='health-weight-form'){
   const result=o.addWeight(selectedDate,data.get('weight'),data.get('note'));if(!result.ok){error(result.message);return;}save();$('#modal').close();refresh();o.toast(result.review?'异常体重待后台复核，暂不计统计':'体重已生效，曲线与统计已更新');
  }

</script><script>(function(root){'use strict';root.PrivacyPanel={create(o){

async function process(file,inline=false,planId=null){if(!file||processing)return;if(h().signedIn===false)return;pending=null;const task=++token;error='';if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8*1024*1024){error='请选择不超过 8 MB 的 JPG、PNG 或 WebP 图片';o.render();if(inline)showError();return;}processing=true;let locked=false,completed=false,aiRequest=null;o.render();try{const bitmap=await createImageBitmap(file);if(task!==token){bitmap.close();return;}const scale=Math.min(1,640/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bitmap.width*scale));c.height=Math.max(1,Math.round(bitmap.height*scale));c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);bitmap.close();const photo=c.toDataURL('image/jpeg',.75);let hash=0;for(let i=0;i<photo.length;i++)hash=(hash*31+photo.charCodeAt(i))|0;const photoHash=String(hash);if(today().meals.some(m=>m.photoHash===photoHash)){error='这张照片今天已经计入日记，请避免重复记录。';return;}if(root.AIModel&&o.state().ai){const gate=root.AIModel.gate(o.state(),'photo',o.date);if(!gate.ok&&gate.code!=='personal'){error=gate.message;return;}}if(root.GrowthModel.access(o.state(),o.date).remaining<1){pending={file,inline,planId};locked=true;return;}if(root.AIModel&&o.state().ai){const r=root.AIModel.begin(o.state(),'photo',o.date,'photo-ai-'+Date.now()+'-'+(++o.state().ai.seq));if(!r.ok){error=r.message;return;}aiRequest=r.id;if(o.state().ai.config.mode!=='mock'){error='真实AI服务端尚未部署，本次调用已回退额度';return;}}const time=clock(),slot=E.mealSlot(time.hour),recipeId={breakfast:'oatbowl',lunch:'chickenbowl',dinner:'eggbowl'}[slot];let f,quantity,unit,n;

function postCard(p,owner=false){if(p.status==='deleted')return `<article class="forum-post deleted-post"><b>这篇帖子已删除</b><p>不再展示文字、图片及互动内容；审核留痕仅在演示总部保留。</p></article>`;const logged=state().health.signedIn!==false,item=owner?null:C.sharePayload(p),comments=C.visibleComments(p,logged?'me':null),approved=p.status==='approved';return `<article class="forum-post" id="post-${p.id}"><div class="panel-head"><div><span class="avatar">${owner?'我':p.anonymous!==false?'匿':'友'}</span> <b>${owner?'我的发布':esc(item.author)}</b><small> · ${p.date} · ${esc(p.kind)}</small>${p.demo?'<span class="mini-tag">内置审核示例</span>':''}</div>${owner?`<span class="status ${approved?'':'pending'}">${{pending:'总部审核中',approved:'已公开',rejected:'审核未通过',withdrawn:'已撤回'}[p.status]}</span>`:''}</div>${p.recommended?'<span class="mini-tag">推荐</span>':''}${p.title?`<h3>${esc(p.title)}</h3>`:''}<p class="post-text">${esc(p.text)}</p><div class="forum-images">${p.images.map((src,i)=>`<img src="${src}" alt="${owner?'本人':'已审核公开'}帖子图片${i+1}" loading="lazy">`).join('')}</div>${owner&&p.audit?.length?`<p class="hint">总部反馈：${esc(p.audit.at(-1).note)}</p>`:''}${approved?`<div class="post-actions"><button class="btn small ${logged&&(p.likes||[]).includes('me')?'liked':''}" aria-pressed="${logged&&(p.likes||[]).includes('me')}" data-like-post="${p.id}">${(p.likes||[]).includes('me')?'♥ 已赞':'♡ 点赞'} ${(p.likes||[]).length}</button><button class="btn small" data-comment-post="${p.id}">◌ 评论 ${(p.comments||[]).filter(c=>c.status==='approved').length}</button><button class="btn small" data-share-post="${p.id}">↗ 分享 ${p.shares||0}</button><button class="btn small" data-next-favorite="${p.id}">${(p.favorites||[]).includes('me')?'★ 已收藏':'☆ 收藏'} ${(p.favorites||[]).length}</button><button class="btn small" data-next-complain="${p.id}">投诉</button>${p.user==='me'&&logged?`<button class="btn small delete-action" data-delete-post="${p.id}">删除我的帖子</button>`:''}</div><div class="comment-list">${comments.map(c=>`<div class="post-comment"><div><b>${esc(c.author)}${c.mine?' · 我':''}</b><small>${c.date}${c.status==='pending'?' · 待总部审核，仅本人可见':''}</small></div><p>${esc(c.text)}</p>${c.mine?`<button class="btn ghost" data-delete-comment="${c.id}" data-parent-post="${p.id}">删除我的评论</button>`:''}</div>`).join('')}</div>`:p.user==='me'?`<div class="post-actions"><button class="btn small delete-action" data-delete-post="${p.id}">删除我的帖子</button></div>`:''}</article>`;}
function forum(){const d=data(),progress=C.eligible(d.posts,'me',d.rule,date),done=claimed('forum-'+d.rule.id+'-me');let posts=myPosts?d.posts.filter(p=>p.user==='me'):d.posts.filter(p=>p.status==='approved');if(focusId)posts=posts.filter(p=>p.id===focusId&&p.status==='approved');return `<section class="forum-section forum-page" id="forum"><div class="forum-heading"><div><div class="eyebrow">SMALL STORIES, SHARED MOTIVATION</div><h2>轻友论坛</h2><p>看见彼此的坚持，分享生活里的小进步。</p></div><div class="toolbar-group"><button class="btn" data-view="home">返回挑战首页</button><button class="btn primary" data-community="compose">+ 发布帖子 / 图片打卡</button></div></div>${o.rewardPanel?o.rewardPanel('forum'):''}<div class="toolbar"><div class="segmented"><button data-forum-mode="public" class="${myPosts?'':'active'}">全部公开帖子</button><button data-forum-mode="mine" class="${myPosts?'active':''}">我的帖子与审核状态</button></div><button class="btn ghost" data-community="forum-demo">连续发布奖励演示</button></div><div class="notice">匿名对其他用户隐藏身份。</div>${focusId?'<div class="toolbar"><span class="mini-tag">来自分享链接</span><button class="btn soft" data-community="open-forum">查看全部帖子</button></div>':''}<div class="forum-feed">${posts.slice().reverse().sort((a,b)=>Number(!!b.recommended)-Number(!!a.recommended)).map(p=>postCard(p,myPosts)).join('')||`<div class="panel panel-pad center-empty"><h3>${focusId?'此帖子尚未公开或已删除':'把今天的一点坚持，留在这里。'}</h3><p>${focusId?'可返回全部公开帖子继续浏览。':myPosts?'暂无个人帖子，点击发布记录自己的坚持。':'暂无审核通过的公开内容。'}</p></div>`}</div></section>`;}

async function shareCard(id){const p=data().posts.find(p=>p.id===id),v=p&&C.sharePayload(p);if(!v)return;const canvas=document.createElement('canvas');canvas.width=720;canvas.height=v.images.length?1080:700;const ctx=canvas.getContext('2d');ctx.fillStyle='#f1f5e8';ctx.fillRect(0,0,720,canvas.height);ctx.fillStyle='#143f35';ctx.fillRect(0,0,720,110);ctx.fillStyle='#e9f2df';ctx.font='bold 32px Microsoft YaHei, sans-serif';ctx.fillText('轻友论坛 · 每一份坚持都值得',36,68);ctx.fillStyle='#1d6651';ctx.font='22px Microsoft YaHei, sans-serif';ctx.fillText(v.author+' · '+v.date,36,158);let y=206,line='';ctx.font='26px Microsoft YaHei, sans-serif';for(const ch of [...v.text].slice(0,200)){if(ch.charCodeAt(0)===10||ctx.measureText(line+ch).width>640){ctx.fillText(line,36,y);y+=40;line=ch.charCodeAt(0)===10?'':ch;if(y>460)break;}else line+=ch;}if(y<=460)ctx.fillText(line,36,y);if(v.images[0]){const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=v.images[0];});const scale=Math.min(648/img.width,440/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(720-w)/2,520,w,h);}ctx.fillStyle='#708569';ctx.font='20px Microsoft YaHei, sans-serif';ctx.fillText('已审核公开内容 · 到轻友论坛，一起继续坚持',36,canvas.height-45);if(!C.sharePayload(p))return;const output=$('#forum-share-output');if(!output)return;const src=canvas.toDataURL('image/png');output.innerHTML=`<img class="share-preview wide-gap" src="${src}" alt="生成的帖子分享图片"><a class="btn soft wide-gap" href="${src}" download="轻友论坛分享-${id}.png">下载分享图片 ↓</a>`;}

function seedForumExamples(){const d=data();if(d.interactionVersion===8)return;const canvas=document.createElement('canvas');canvas.width=720;canvas.height=450;const x=canvas.getContext('2d');x.fillStyle='#e8f0dd';x.fillRect(0,0,720,450);x.fillStyle='#ffffff';x.beginPath();x.arc(370,215,155,0,Math.PI*2);x.fill();for(let i=0;i<7;i++){x.fillStyle=i%2?'#72a366':'#397b53';x.beginPath();x.arc(270+i*28,180+(i%3)*32,31,0,Math.PI*2);x.fill();}x.fillStyle='#ead6a5';x.fillRect(360,240,125,45);x.fillStyle='#143f35';x.font='bold 25px Microsoft YaHei, sans-serif';x.fillText('认真吃饭，好好记录。',32,50);x.font='18px Microsoft YaHei, sans-serif';x.fillText('内置打卡图片示意 · 非真实餐食照片',32,413);d.posts.unshift({id:'demo-forum-meal',demo:true,user:'demo-user-meal',nickname:'晨光轻友',anonymous:true,date,text:'今天给自己准备了一份简单的午餐。认真吃饭，规律记录，慢慢养成自己的好习惯。你今天完成打卡了吗？',kind:'饮食打卡',images:[canvas.toDataURL('image/png')],status:'approved',likes:[],comments:[],audit:[{status:'approved',note:'内置演示文字与图片，已模拟总部审核',date,reviewer:'总部示例'}]},{id:'demo-forum-walk',demo:true,user:'demo-user-walk',nickname:'散步的青禾',anonymous:false,date,text:'下班后散步20分钟，今天的小目标完成了。欢迎一起分享那些让自己更舒服的生活方式。',kind:'运动打卡',images:[],status:'approved',likes:[],comments:[],audit:[{status:'approved',note:'内置文字示例，已模拟总部审核',date,reviewer:'总部示例'}]});d.interactionVersion=8;o.save();}

async function images(files){if(!files.length||loading)return;const check=C.validateImageSelection(draft.length,files);if(!check.ok){$('#community-post-error').textContent=check.message;return;}const token=++imageToken,previous=[...draft],items=[],output=$('#forum-draft-images');loading=true;$('#submit-forum-post').disabled=true;$('#forum-choose-images').disabled=true;$('#community-post-error').textContent='正在处理图片…';draftImages();try{for(const f of files){const bitmap=await createImageBitmap(f);if(token!==imageToken||!output.isConnected){bitmap.close();return;}const scale=Math.min(1,720/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();items.push(canvas.toDataURL('image/jpeg',.7));}if(token===imageToken&&output.isConnected){draft=[...previous,...items];$('#community-post-error').textContent='';}}catch(e){if(token===imageToken&&output.isConnected){draft=previous;$('#community-post-error').textContent='图片无法读取，请更换JPG、PNG或WebP图片；原有图片已保留。';}}finally{if(token===imageToken){loading=false;if($('#submit-forum-post'))$('#submit-forum-post').disabled=false;if($('#forum-choose-images'))$('#forum-choose-images').disabled=false;draftImages();}}}

</script><script>(function(root){'use strict';root.PlanTaskViews={create(o){const T=root.PlanTasksModel,esc=o.esc,names={signin:'打卡计划',photo:'每日拍照计划',exercise:'每日运动计划'},icons={signin:'☑',photo:'▧',exercise:'↗'},tips={signin:'来一次签到，记录今天的坚持',photo:'记录餐食草稿，识餐或手动录入均可完成',exercise:'按计划活动后，点击标记已完成'};

function view(p,date){const current=o.state().ai.plans.current?.id===p.id,active=T.tasks(p,date),records=p.tasks?.records||[],miss=T.missed(p,o.date);return `<section class="plan-task-section wide-gap"><div class="panel-head"><div><span class="membership-kicker">DAILY LITTLE WINS</span><h2>把计划，变成今天的小行动</h2><p>${date} · 当前连续打卡 ${T.streak(o.state(),o.date)} 天 · 本周期记录 ${records.length} 条</p></div>${current&&T.inCycle(p,o.date)?`<button class="btn soft" data-plan-task="configure">${p.tasks?'任务与提醒设置':'选择每日任务'}</button>`:''}</div>${!p.tasks?'<div class="notice">方案已生成。自主选择需要开启的任务，确认后生效；未选择的任务不展示、不提醒。</div>':!active.length?'<div class="notice">这一天没有启用任务，可在设置中选择。任务只从确认当天起生效。</div>':`<div class="plan-task-grid">${active.map(t=>`<article class="panel panel-pad"><span class="task-symbol">${icons[t.type]}</span><span class="status ${t.done?'':'pending'}">${t.done?'已完成':date<o.date?'当日未完成':date>o.date?'尚未开始':'待完成'}</span><h3>${names[t.type]}</h3><p>${tips[t.type]}</p><small>${t.remind?'◷ '+t.time+' · 微信订阅提醒待接入':'提醒已关闭'}</small><button class="btn ${t.done?'soft':'primary'} wide-gap" data-plan-complete="${t.type}" ${!current||date!==o.date||t.done?'disabled':''}>${t.done?'✓ 已完成':t.type==='photo'?'拍一拍，完成任务':t.type==='exercise'?'标记已完成':'立即打卡'}</button></article>`).join('')}</div>`}<p class="hint">当天完成任一任务，挑战签到计1天；同日不重复累计。运动任务为自主确认，不虚构运动消耗。${current?'今日未结束，不计漏打卡。':'历史周期只读，保留当时的任务与提醒。'}已过日期漏打卡 ${miss.length} 天。</p><details class="panel panel-pad"><summary>查看本周期全部任务记录（${records.length}条）</summary>${records.slice().reverse().map(r=>`<p>${r.date} · ${names[r.type]} · 已完成${r.mealId?' · 已关联识餐记录':''}</p>`).join('')||'<p>暂无完成记录</p>'}${miss.length?'<p class="hint">未完成日期：'+miss.join('、')+'。预估仅调整情景假设，不覆盖手动体重。</p>':''}</details></section>`;}
function configure(){const p=o.state().ai.plans.current;if(!p)return;const config=T.config(p,o.date),defaults=T.defaults(p);o.modal(`<h2>选择任务与每日提醒</h2><p>根据自由时间 ${esc(p.request.start)}—${esc(p.request.end)} 推荐提醒时点，可自行修改（北京时间）。</p><form id="plan-task-config"><div class="plan-task-settings">${T.types.map(k=>{const c=config[k]||{enabled:false,time:defaults[k],remind:true},times=new Set([c.time,defaults[k],...Array.from({length:288},(_,i)=>String(Math.floor(i/12)).padStart(2,'0')+':'+String(i%12*5).padStart(2,'0'))]);return `<div class="panel panel-pad"><label><input type="checkbox" name="${k}Enabled" ${c.enabled?'checked':''}> <b>${names[k]}</b></label><p>${tips[k]}</p><label class="field">每日提醒时间<select name="${k}Time">${[...times].sort().map(v=>`<option ${v===c.time?'selected':''}>${v}</option>`).join('')}</select></label><label><input type="checkbox" name="${k}Remind" ${c.remind?'checked':''}> 开启此任务提醒</label></div>`;}).join('')}</div><p class="hint">未勾选的任务不展示、不触发提醒。关闭提醒保留任务。保存不会清空已完成记录，不追溯修改过去日期。</p><div class="error" id="plan-task-error"></div><button class="btn primary wide-gap">确认启用 / 保存修改</button></form><div class="notice wide-gap">微信订阅消息 · ${p.tasks?.subscriptionDemo==='accepted'?'已模拟同意，尚未连接真实推送':'尚未模拟授权'}<button class="btn ghost small" data-plan-task="subscribe">模拟订阅授权</button><button class="btn ghost small" data-plan-task="preview">预览提醒卡片</button></div><p class="hint">本地演示不发送消息。正式推送需用户授权、可用模板及服务端定时任务；授权不足时需再次订阅。</p>`);}
document.addEventListener('submit',e=>{if(e.target.id!=='plan-task-config')return;e.preventDefault();const d=new FormData(e.target),p=o.state().ai.plans.current,values=Object.fromEntries(T.types.map(k=>[k,{enabled:d.has(k+'Enabled'),time:d.get(k+'Time'),remind:d.has(k+'Remind')}])),r=T.configure(o.state(),p.id,values,o.date);if(!r.ok){document.querySelector('#plan-task-error').textContent=r.message;return;}document.querySelector('#modal').close();refresh('每日任务与提醒时间已保存');});

}};})(window);
</script><script>(function(root){'use strict';root.AIViews={create(o){const M=root.AIModel,esc=o.esc,$=s=>document.querySelector(s),state=o.state,date=o.date,labels={plan:'AI计划生成',recipe:'AI食谱生成',photo:'AI图片识餐'};let tab='main',selected=null,dayIndex=0,shown=null,busy=false,draft={days:14,lossJin:1,start:'18:00',end:'18:30',...o.state().ai.plans.current?.request},pending=null,filter={from:'',to:''};

function plan(){const p=M.snapshot(state(),date),current=getPlan();return `<section class="ai-hero"><span class="membership-kicker">MY AI HEALTH PLAN</span><h2>把目标拆成每天的小进步。</h2><p>家常三餐、适合自己的活动时间，让每一天更有方向。</p><span class="pill">${c().mode==='mock'?'本地模拟 · 非真实模型生成':'真实服务待部署'}</span></section>${quota()}<section class="panel panel-pad"><div class="panel-head"><h2>自动同步我的健康档案</h2><button class="btn soft small" data-ai="health">完善健康档案 ↗</button></div><div class="ai-profile-grid">${[['年龄',p.age?p.age+'岁':'待完善'],['身高',p.height?p.height+'cm':'待完善'],['手动体重',p.weight?p.weight+'kg':'待记录'],['忌口',(p.avoid||[]).join('、')||'未填写'],['食材过敏',(p.allergies||[]).join('、')||'未填写'],['身体状态',({general:'普通成人',pregnant:'孕期',lactating:'哺乳期',chronic:'慢性病',other:'其他需专业确认'})[p.healthStatus]||'普通成人'],['疾病/用药',p.conditions||'未填写']].map(([k,v])=>`<div><small>${k}</small><b>${esc(v)}</b></div>`).join('')}</div></section><section class="panel panel-pad wide-gap"><h2>${a().plans.current?'调整目标，重新生成':'先设定你的目标'}</h2><form id="ai-plan-form" novalidate><div class="form-grid"><label class="field">每日活动开始时间<input name="start" type="time" value="${draft.start}" required></label><label class="field">每日活动结束时间<input name="end" type="time" value="${draft.end}" required></label><label class="field">目标周期（天）<input name="days" type="number" min="1" max="${root.LongPlanModel.maxDays(date)}" value="${draft.days}" required><small>最少1天 · 最长3年，本次最多${root.LongPlanModel.maxDays(date)}天（含闰日）</small></label><label class="field">目标减重（斤）<input name="lossJin" type="number" min="0" max="100" step="0.1" value="${draft.lossJin}" required><small>1斤=0.5kg，过快目标会被安全校验拦截</small></label></div><p class="hint">重新生成读取最新档案，整体替换当前方案；失败不改原计划。当前计划之外最多保存3期历史。特殊身体状态暂停量化减重目标。</p><div class="error" id="ai-plan-error" role="alert"></div><button class="btn primary" ${busy||!c().textEnabled?'disabled':''}>${busy?'正在合理分析规划中':!c().textEnabled?'总部已关闭AI计划生成':a().plans.current?'重新生成计划（共用1次）':'生成我的计划（共用1次）'}</button></form></section>${current&&JSON.stringify([cu function reflow(s,date){const w=W.init(s,date),remaining=new Map();for(const seg of w.segments)if(seg.end>date){const n=Math.round((Date.parse(seg.end)-Date.parse(seg.start>date?seg.start:date))/day);remaining.set(seg.grantId,(remaining.get(seg.grantId)||0)+n);}const past=w.segments.filter(x=>x.start<date).map(x=>({...x,end:x.end>date?date:x.end}));let cursor=date;for(const g of w.grants.filter(g=>!g.revoked)){const n=remaining.get(g.id)||0;if(n>0){past.push({grantId:g.id,start:cursor,end:W.add(cursor,n)});cursor=W.add(cursor,n);}}w.segments=past;}

el class="field role-select">模拟查看身份<select id="review-role"><option value="consumer" ${role==='review'?'':'selected'}>消费者（只读审核）</option><option value="review" ${role==='review'?'selected':''}>区域审核员（模拟）</option></select></label></div><div class="table-wrap"><table><thead><tr><th>称重日期</th><th>体重</th><th>上次 / 月初</th><th>来源与备注</th><th>状态</th><th>处理</th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(r.date)}</td><td class="score">${r.value} <small>kg</small></td><td class="subtext">${r.previous??'—'} / ${r.baseline??(r.date.endsWith('-01')?r.value:'82')} kg</td><td><div class="record-detail">${esc(r.source)}<br>${esc(r.note||'无备注')}${r.flagged?'<br><span style="color:#ac8548">⚑ 与上次有效记录差异超过演示阈值</span>':''}</div></td><td><span class="status ${r.status==='pending'?'pending':r.status==='rejected'?'rejected':''}">${{approved:'已核验',pending:r.flagged?'异常待复核':'待核验',rejected:'已驳回'}[r.status]}</span></td><td>${r.status==='pending'&&role==='review'?`<span class="actions-cell"><button class="btn small soft" data-review="${esc(r.id)}" data-decision="approved">通过</button><button class="btn small" data-review="${esc(r.id)}" data-decision="rejected">驳回</button></span>`:`<span class="subtext">${r.status==='pending'?'等待审核':'已留痕'}</span>`}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">此月无个人明细记录</td></tr>'}</tbody></table></div>${state.audit.length?`<p class="hint">最近审核：${esc(state.audit.at(-1).message)} · ${esc(state.audit.at(-1).time)}</p>`:''}</section><div class="two-col"><section class="panel panel-pad"><h2>防换人称重，需要组合验证</h2><ul class="rules-list"><li>账号、设备、原始时间与称重记录同步关联。</li><li>拍照与绑定秤都不能单独保证是本人称重。</li><li>照片挑战、授权身份核验、异常人工复核等需评估成本和隐私。</li></ul></section><section class="panel panel-pad"><h2>未来接入边界</h2><ul class="rules-list"><li>秤接入前确认厂商协议、用户绑定与离线重传。</li><li>照片记录需防重放，明确保留期限和访问权限。</li><li>称重异常审核不应简单按差值自动判定作弊。</li></ul></section></div>`;}
